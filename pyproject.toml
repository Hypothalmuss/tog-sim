[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["build", "install", "log", "third_party", "togsim_hmi/static/vendor"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]
ignore = ["N802", "N806", "N812", "N999", "E741"]

[tool.pytest.ini_options]
testpaths = ["src/togsim_description/test", "src/togsim_perception/test", "src/togsim_task/test"]
