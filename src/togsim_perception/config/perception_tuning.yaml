# Tuned gates of the vision pipeline (values validated on the 120-cycle benches, see docs/benchmarks.md).
# Loaded by perception.launch.py (tray_vacancy_node) and by the scripts for conveyor_tracker.
tray_vacancy_node:
  ros__parameters:
    visibility_min: 0.95      # mask area / expected tray area; below this the tray is entering/leaving the view
                              # or hidden by the arm and its centroid is biased (at 80 % visible by ~35 mm)
    lattice_gate_m: 0.035     # max correction the pocket-lattice fit may apply to the mask pose (the lattice is
                              # periodic: a fit shifted by one pitch looks just as good)
    lattice_min_fit: 5        # pockets that must match for the lattice correction to be accepted
    lattice_rms_max: 0.006    # m, lattice fit residual
    id_gate_x_m: 0.08         # tray id continuity along the belt (prediction vs observation)
    id_gate_y_m: 0.025        # trays never move sideways: a lateral mismatch is another tray
    floor_band_m: 0.004       # depth band around the pocket-floor depth that defines pocket-floor blobs
    blob_min_px: 120          # smallest pocket-floor blob used for the lattice fit / the tray-model choice
conveyor_tracker:
  ros__parameters:
    tray_lost_s: 8.0          # s, a tray track is kept (predicted on the belt model) this long after its last
                              # observation: the 620 mm bar tray is last seen whole at x ~0.47 and its last pocket
                              # is placed up to 6.5 s later (at 4.0 the frame vanished mid-transfer: 2 aborts / 40)
    gate_m: 0.06              # geometric association gate (unkeyed products)
    lost_s: 2.5               # products are hidden under the arm for most of a pick
    mature_alpha: 0.25        # product observation weight once a track has 10 observations
    latency_s: 0.03           # capture-to-stamp latency (vision trails ground truth by ~3 mm at 0.09 m/s)
    tool_frame: tcp           # observations within 0.30 x 0.20 m of this frame are ignored (arm over the object)
