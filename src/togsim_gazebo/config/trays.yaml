    label: 3
  # bar tray: 2 rows x 3 columns, bars lie along x (168 x 42 mm)
  tray_bar_2x3:
    rows: 2
    cols: 3
    pitch_x: 0.200
    pitch_y: 0.065
    pocket_x: 0.186
    pocket_y: 0.054
    pocket_depth: 0.025
    wall: 0.004
    base_thickness: 0.004
    margin: 0.010
